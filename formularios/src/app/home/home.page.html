<ion-header><ion-toolbar color="primary"><ion-title>Registro de estudiantes</ion-title></ion-toolbar></ion-header>
<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header><ion-card-title>Nuevo estudiante</ion-card-title></ion-card-header>
    <ion-card-content>
      <ion-item><ion-input label="Nombre" labelPlacement="stacked" placeholder="Ingrese su nombre" [(ngModel)]="nombre"></ion-input></ion-item>
      <ion-item><ion-input label="Correo electrónico" labelPlacement="stacked" type="email" placeholder="correo@ejemplo.com" [(ngModel)]="correo"></ion-input></ion-item>
      <ion-item><ion-input label="Edad" labelPlacement="stacked" type="number" placeholder="Ingrese su edad" [(ngModel)]="edad"></ion-input></ion-item>
      <ion-button expand="block" class="ion-margin-top" [disabled]="guardando" (click)="guardar()">{{ guardando ? 'Guardando...' : 'Guardar estudiante' }}</ion-button>
      <p *ngIf="mensaje" role="status">{{ mensaje }}</p>
    </ion-card-content>
  </ion-card>
  <h2>Estudiantes registrados</h2>
  <ion-list><ion-item *ngFor="let estudiante of estudiantes"><ion-label><h2>{{ estudiante.nombre }}</h2><p>{{ estudiante.correo }}</p><p>Edad: {{ estudiante.edad }}</p></ion-label></ion-item></ion-list>
</ion-content>
